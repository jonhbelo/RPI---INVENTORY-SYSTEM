<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPI Inventory System</title>
<style>
:root{--bg:#0d1017;--side:#131823;--card:#161b27;--tx:#f1f3f7;--mut:#8b93a5;--bd:#252b3a;--ac:#6b8cff;--ok:#34d399;--lo:#fbbf24;--neg:#f87171;--wm:.05;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#eef0f5;--side:#fff;--card:#fff;--tx:#161a24;--mut:#667085;--bd:#dde1ea;--ac:#3b5bdb;--ok:#059669;--lo:#b45309;--neg:#dc2626;--wm:.07;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex}
aside{width:300px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:8px;height:100vh;position:sticky;top:0}
.logo{background:#fff;border-radius:10px;height:77px;display:flex;align-items:center;justify-content:center;gap:8px;color:#1e2a78;margin-bottom:18px}
.logo b{font-size:19px;letter-spacing:-.5px;display:block;line-height:1}
.logo small{font-size:7px;font-weight:700;letter-spacing:.5px;display:block;border-top:1px solid #1e2a78;margin-top:2px;padding-top:2px}
.logo i{width:44px;height:22px;border-radius:50%;background:#2d3a9c;display:block;transform:rotate(-12deg)}
.nv{display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:9px;color:var(--tx);cursor:pointer;border:0;background:none;width:100%;font:inherit;font-size:16px;text-align:left;margin-bottom:3px}
.nv.on{background:var(--bd)}
.nv svg{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2}
.nv.on svg{stroke:var(--ac)}
.foot{margin-top:auto;border-top:1px solid var(--bd);padding-top:14px;font-size:13px}
.foot .r{display:flex;justify-content:space-between;align-items:center}
.foot .g{color:var(--ok)}.foot .s{color:var(--mut);font-size:12px;margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px}
.main{flex:1;min-width:0;padding:24px 30px;position:relative;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='340' height='150'><text x='10' y='80' transform='rotate(-8 170 75)' font-family='Georgia,serif' font-style='italic' font-weight='700' font-size='22' fill='%23808a9e' fill-opacity='.14'>Rite Products, Incorporated</text></svg>")}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:30px;letter-spacing:-.5px}
.top p{margin:2px 0 0;color:var(--mut);font-size:14px}
.sp{flex:1}
.cdb{display:flex;align-items:center;gap:8px;border:1px solid #1f6b52;background:rgba(16,120,80,.2);color:var(--ok);padding:9px 14px;border-radius:9px;font-size:14px}
.add{background:var(--ac);color:#fff;border:0;padding:10px 16px;border-radius:9px;font:inherit;cursor:pointer;display:flex;gap:8px;align-items:center}
.ic{width:38px;height:38px;border:1px solid var(--bd);border-radius:9px;background:var(--card);cursor:pointer;color:var(--lo);font-size:16px}
.av{width:38px;height:38px;border-radius:50%;background:#5b6cf0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.bar{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:0}
.bar input,.bar select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:12px 14px;font:inherit}
.bar input{flex:1}.bar select{width:220px}
.tb{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:-1px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:rgba(120,130,160,.1);text-align:left;font-size:13px;letter-spacing:.3px;text-transform:uppercase;padding:18px 14px;color:var(--tx);font-weight:700;line-height:1.25}
td{padding:14px;border-top:1px solid var(--bd);height:68px}
.r{text-align:right}
td.c{color:var(--mut)}
.n{color:var(--mut)}.pi{color:var(--ok)}.po{color:var(--neg)}
.end{font-weight:700;font-size:17px}
.al{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--mut)}
.al input{width:70px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:7px 12px;font:inherit}
.pill{display:inline-block;padding:8px 10px;border-radius:20px;font-size:13px;font-weight:600;max-width:74px;line-height:1.2}
.p-low{background:rgba(251,191,36,.18);color:var(--lo)}
.p-out{background:rgba(139,147,165,.18);color:var(--mut)}
.p-in{background:rgba(52,211,153,.16);color:var(--ok)}
.p-neg{background:rgba(248,113,113,.18);color:var(--neg)}
.ed{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9}
.md.on{display:flex}
.md>div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;width:520px;max-width:92vw}
.md h3{margin:0 0 12px}
.md label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.md input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px;font:inherit}
.md .a{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.ph{padding:60px;text-align:center;color:var(--mut)}
@media(max-width:860px){aside{width:200px}.main{padding:16px}.nv{font-size:14px;padding:9px 10px}}
textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:10px;font:13px ui-monospace,monospace}.f{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.f input,.f select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:10px;font:inherit}.pad{padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:14px}.bn{padding:10px 14px;border-radius:9px;margin-bottom:12px;font-size:14px}.bn.w{background:rgba(251,191,36,.15);color:var(--lo)}.bn.e{background:rgba(248,113,113,.15);color:var(--neg)}.mut{color:var(--mut)}select.rl{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px;font:inherit}.nv{font-size:15px}.na aside{display:none}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.ac{width:400px;max-width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px}.ac h2{margin:18px 0 2px}.ac p{margin:0;color:var(--mut);font-size:14px}.ac label,.sf label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}.ac input,.sf input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:11px;font:inherit}.pw{position:relative}.pw input{padding-right:72px}.eye{position:absolute;right:6px;top:5px;border:0;background:none;color:var(--ac);cursor:pointer;font:inherit;padding:6px 8px}.am{min-height:20px;margin:10px 0;font-size:13px;color:var(--neg)}.ac .add{width:100%;justify-content:center}.sw{margin-top:14px;text-align:center;font-size:14px;color:var(--mut)}.sw button{border:0;background:none;color:var(--ac);cursor:pointer;font:inherit}
.main{background-image:none!important;position:relative;z-index:1}aside{z-index:2}
.logo{height:auto;padding:12px 10px}.logo svg{width:100%;height:auto;display:block}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.wm{position:absolute;filter:grayscale(1);opacity:.1;transform:rotate(var(--r));animation:dr var(--d) ease-in-out var(--l) infinite alternate}
:root:not([data-theme=light]) .wm{filter:grayscale(1) invert(1);opacity:.07}
@keyframes dr{from{transform:translate(0,0) rotate(var(--r))}to{transform:translate(var(--x),var(--y)) rotate(calc(var(--r) + 12deg))}}
.intro{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;animation:fo .5s ease 2.2s forwards}
.intro .lc{width:min(440px,82vw);background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:drop 1.9s cubic-bezier(.25,.9,.3,1.15) both}
.intro svg{width:100%;display:block}
@keyframes drop{0%{transform:translateY(-110vh) rotate(-720deg);opacity:0}15%{opacity:1}60%{transform:translateY(0) rotate(14deg)}78%{transform:translateY(-28px) rotate(-6deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes fo{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.wm{animation:none}.intro .lc{animation:none}}
.menu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--bd);border-radius:10px;min-width:220px;padding:6px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.menu>div{padding:8px 10px;color:var(--mut);font-size:13px}.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:9px 10px;border-radius:7px;cursor:pointer;font:inherit}.menu button:hover{background:var(--bd)}
.av{cursor:pointer;border:0;font:inherit;font-size:16px}
.ln{display:flex;gap:8px;margin-bottom:8px}.ln input[list]{flex:1;min-width:0}.ln input[type=number]{width:100px}
.ln input,.md input,.md select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px;font:inherit}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--bd);padding:12px 16px;border-radius:10px;z-index:99;max-width:340px}
.am.ok{color:var(--ok)}.sf{max-width:440px}.sf h3{margin:0 0 4px}
.md>div{max-height:92vh;overflow:auto}
html,body{height:100%}.main{height:100vh;overflow-y:auto}
.top{position:sticky;top:0;z-index:8;margin:-24px -30px 12px;padding:18px 30px 12px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(8px)}
.tb{max-height:62vh;overflow:auto}.tb.st{max-height:calc(100vh - 250px)}
.card,.tb,.bar{background:color-mix(in srgb,var(--card) 82%,transparent)!important}
.tb th{position:sticky;top:0;z-index:3;background:var(--card)!important}
.wm{opacity:.24!important}:root:not([data-theme=light]) .wm{opacity:.2!important}
.ed.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.intro{animation:fo .6s ease 3s forwards!important}
.intro .lc{width:min(420px,78vw);transform-origin:center;animation:lgdrop 3.5s both!important}
@keyframes lgdrop{0%{transform:translateY(-115vh) scale(1);opacity:1;animation-timing-function:cubic-bezier(.55,0,1,.55)}
24%{transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
38%{transform:translateY(-110px) scale(1);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
50%{transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
60%{transform:translateY(-45px) scale(1);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
68%{transform:translateY(0) scale(1);animation-timing-function:ease-in}
78%{transform:translateY(0) scale(1);opacity:1;animation-timing-function:cubic-bezier(.7,0,.9,.5)}
100%{transform:translateY(0) scale(14);opacity:0}}
@media(prefers-reduced-motion:reduce){.intro .lc{animation:none!important}.intro{animation:fo .4s ease .6s forwards!important}}
.top{padding:12px 30px 8px;margin-bottom:8px}.top h1{font-size:26px}.top p{font-size:13px}
.bar{padding:10px 12px}.bar input,.bar select{padding:8px 12px}
.tb.st{max-height:calc(100vh - 215px)}
.tb td{padding:5px 10px;height:36px;font-size:14px}
.tb th{padding:9px 10px;font-size:12px;line-height:1.2}
.tb .pill{padding:3px 10px;font-size:12px;max-width:none;white-space:nowrap}
.tb .al input{width:56px;padding:4px 8px;font-size:13px}
.tb .ed{padding:3px 10px;font-size:13px}
.tb .end{font-size:15px}
.main{padding:0 30px 24px!important}
.top{margin:0 -30px 10px!important;padding:14px 30px 10px!important}
.md>div.w{width:min(800px,95vw)}
.sb{position:relative;flex:1;min-width:0}.sb input{width:100%}
.cx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);font-size:22px;line-height:1;cursor:pointer;display:none;padding:2px 8px}
.sb.has .cx{display:block}.sb.has input{padding-right:36px}
.clk{cursor:pointer}.clk:hover td{background:rgba(120,130,160,.14)}
.dt{white-space:nowrap}.wr{white-space:normal!important}
.us td{height:58px!important}.u{display:flex;align-items:center;gap:12px}
.uav{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
