.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px}
.main{flex:1;min-width:0;padding:24px 30px;position:relative;

.tb{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:-1px;overflow:auto}
table{width:100%;border-collapse:collapse}

td{padding:14px;border-top:1px solid var(--bd);height:68px}
.r{text-align:right}

.p-neg{background:rgba(248,113,113,.18);color:var(--neg)}
.ed{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9}
.md.on{display:flex}
.md div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;width:360px;max-width:92vw}
.md h3{margin:0 0 12px}
.md label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.md input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px;font:inherit}
.md .a{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.ph{padding:60px;text-align:center;color:var(--mut)}
@media(max-width:860px){aside{width:200px}.main{padding:16px}.nv{font-size:14px;padding:9px 10px}}

function pend(type,docId,action,summary,after,before,reason){var id="p_"+Date.now(),rec={id:id,type:type,docId:docId,before:JSON.stringify(before||{}),after:JSON.stringify(Object.assign({action:action,summary:summary},after)),reason:reason||"",by:role,ts:Date.now(),status:"pending",decidedBy:""};
W("append_values",{spreadsheetId:SID,range:"pending!A1",values:[[rec.id,rec.type,rec.docId,rec.before,rec.after,rec.reason,rec.by,rec.ts,"pending",""]]},function(){S.pending.push(rec)})}
function addTxn(t,head,items,by){var id="doc_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),ts=Date.now();
var rows=items.map(function(i){return HD[t].map(function(h){return h==="id"?id:h==="code"?i.code:h==="qty"?i.qty:h==="by"?by:h==="ts"?ts:h==="date"||h==="no"?"'"+(head[h]||""):head[h]||""})});
W("append_values",{spreadsheetId:SID,range:t+"!A1",values:rows},function(){var d={id:id,by:by,items:items};for(var k in head)d[k]=head[k];S[t].push(d)})}
function addProd(p){W("append_values",{spreadsheetId:SID,range:"products!A1",values:[[p.brand,p.code,p.unit,p.opening,p.min]]},function(){S.products.push(Object.assign({_row:S.products.length+2},p))})}
function updProd(code,p){var o=S.products.filter(function(x){return x.code===code})[0];if(!o)return;W("update_values",{spreadsheetId:SID,range:"products!A"+o._row+":E"+o._row,values:[[p.brand,p.code,p.unit,p.opening,p.min]]},function(){Object.assign(o,p)})}
function parseItems(s){var out=[],bad=[];s.split(/\n/).forEach(function(l){l=l.trim();if(!l)return;var m=l.lastIndexOf(",");var c=(m>-1?l.slice(0,m):l).trim(),q=Number(m>-1?l.slice(m+1):1);if(!(q>0)||!S.products.some(function(p){return p.code===c}))bad.push(l);else out.push({code:c,qty:q})});return{ok:out,bad:bad}}
function modal(code){var p=code==null?{brand:"",code:"",unit:"pcs",opening:0,min:10}:S.products.filter(function(x){return x.code===code})[0];if(!p)return;
document.getElementById("mdb").innerHTML="<h3>"+(code==null?"Add product":"Edit product")+'</h3><label>Brand</label><input id="f_b" value="'+esc(p.brand)+'"><label>Product code</label><input id="f_c" value="'+esc(p.code)+'"><label>Unit</label><input id="f_u" value="'+esc(p.unit)+'"><label>Beginning balance</label><input id="f_o" type="number" value="'+p.opening+'"><label>Low stock alert</label><input id="f_m" type="number" min="0" value="'+(p.min===""?10:p.min)+'">'+(code!=null&&role!=="admin"?'<label>Reason for edit (required)</label><input id="f_r">':"")+'<div class="a"><button class="ed" data-x="1">Cancel</button><button class="add" data-s="'+(code==null?"":esc(code))+'">Save</button></div>';document.getElementById("md").classList.add("on")}
function cleanMail(x){return String(x||"").replace(/[\u200B-\u200D\uFEFF\u00A0]/g,"").trim().toLowerCase()}
function b64(buf){var t="";new Uint8Array(buf).forEach(function(x){t+=String.fromCharCode(x)});return btoa(t)}
function newSalt(){return b64(crypto.getRandomValues(new Uint8Array(16)))}
function hashPw(pw,sb){var salt=Uint8Array.from(atob(sb),function(c){return c.charCodeAt(0)});return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:120000},k,256)}).then(b64)}
function setMsg(t){var e=document.getElementById("am");if(e)e.textContent=t||""}
function pwf(id,label,ac){return"<label>"+label+'</label><div class="pw"><input id="'+id+'" type="password" autocomplete="'+ac+'"><button type="button" class="eye" data-eye="'+id+'">Show</button></div>'}
function authV(){var su=amode==="signup",wait=mcp&&!loaded;
return'<div class="auth"><div class="ac"><div class="logo" style="margin-bottom:0"><i></i><div><b>Rite Products, Incorporated</b><small>ENGINEERING SUPPLIES AND SERVICES</small></div></div><h2>'+(su?"Create account":"Sign in")+"</h2><p>"+(su?"Use your company email address.":"RPI Inventory System")+"</p>"+(su?'<label>Full name</label><input id="a_n" autocomplete="name">':"")+'<label>Email</label><input id="a_e" type="email" placeholder="name@riteproducts.com.ph" autocomplete="username">'+pwf("a_p","Password",su?"new-password":"current-password")+(su?pwf("a_c","Confirm password","new-password"):"")+'<div class="am" id="am">'+(wait?"Connecting to the central database…":"")+(!mcp?"Not connected to Google Sheets: accounts stay local to this page.":"")+'</div><button class="add" data-'+(su?"signup":"login")+'="1">'+(su?"Create account":"Sign in")+'</button><div class="sw">'+(su?"Already have an account? ":"New here? ")+'<button data-sw="1">'+(su?"Sign in":"Create account")+"</button></div></div></div>"}
function signIn(a){user=a;role=a.role;try{sessionStorage.setItem("rpi_user",a.email)}catch(e){}tab="stock";render()}
function restore(){try{var e=sessionStorage.getItem("rpi_user");if(!e)return;var a=S.accounts.filter(function(x){return x.email===e})[0];if(a){user=a;role=a.role}}catch(x){}}
function ready(){if(mcp&&!loaded){setMsg("Still connecting, try again in a moment.");return false}if(mcp&&!online){setMsg("Cannot reach the central database. "+err);return false}return true}
function doLogin(){var em=cleanMail(v("a_e")),pw=document.getElementById("a_p").value;if(!em||!pw){setMsg("Enter your email and password.");return}if(!ready())return;
var a=S.accounts.filter(function(x){return x.email===em})[0];if(!a||!a.hash||!a.salt){setMsg("Incorrect email or password.");return}
if(String(a.active).toUpperCase()==="FALSE"){setMsg("This account is disabled.");return}
hashPw(pw,a.salt).then(function(h){if(h!==a.hash)setMsg("Incorrect email or password.");else signIn(a)})}
function doSignup(){var nm=v("a_n"),em=cleanMail(v("a_e")),pw=document.getElementById("a_p").value,pc=document.getElementById("a_c").value;
if(!nm){setMsg("Enter your full name.");return}if(!/^[^@\s]+@riteproducts\.com\.ph$/.test(em)){setMsg("Email must end with @riteproducts.com.ph");return}
if(pw.length<8){setMsg("Password must be at least 8 characters.");return}if(pw!==pc){setMsg("Passwords do not match.");return}if(!ready())return;
if(S.accounts.some(function(x){return x.email===em})){setMsg("An account with this email already exists.");return}
var salt=newSalt();hashPw(pw,salt).then(function(h){var rec={email:em,name:nm,role:S.accounts.length?"viewer":"admin",active:"TRUE",created:today(),salt:salt,hash:h};
W("append_values",{spreadsheetId:SID,range:"accounts!A1",values:[[rec.email,rec.name,rec.role,rec.active,"'"+rec.created,rec.salt,rec.hash]]},function(){S.accounts.push(rec)});signIn(rec)})}
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.closest&&e.target.closest(".ac")){var b=document.querySelector(".ac .add");if(b)b.click()}});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.eye){var f=document.getElementById(d.eye),sh=f.type==="password";f.type=sh?"text":"password";b.textContent=sh?"Hide":"Show"}else if(d.sw){amode=amode==="login"?"signup":"login";render()}else if(d.login)doLogin();else if(d.signup)doSignup();else if(d.out){user=null;role="viewer";amode="login";try{sessionStorage.removeItem("rpi_user")}catch(e){}render()}else if(d.t){tab=d.t;render()}else if(d.e)modal(d.e);else if(d.add)modal(null);else if(d.x)document.getElementById("md").classList.remove("on");
else if(d.s!==undefined){var p={brand:v("f_b").toUpperCase(),code:v("f_c"),unit:v("f_u")||"pcs",opening:Number(v("f_o"))||0,min:v("f_m")===""?"":Number(v("f_m"))};

document.getElementById("md").classList.remove("on");var sm=p.brand+" "+p.code+" · "+p.unit+" · begin "+p.opening+" · alert "+p.min;
if(edit){if(role==="admin")updProd(d.s,p);else{var o=S.products.filter(function(x){return x.code===d.s})[0];pend("stock",d.s,"edit",sm,{p:p},{summary:o.brand+" "+o.code+" · "+o.unit+" · begin "+o.opening+" · alert "+o.min},v("f_r"))}}
else if(role==="viewer")pend("stock",p.code,"add",sm,{p:p});else addProd(p)}
else if(d.save){var t=d.save,h={};FLD[t].forEach(function(x){h[x[0]]=v("f_"+x[0])});var it=parseItems(document.getElementById("items").value);
if(!it.ok.length||it.bad.length){alert(it.bad.length?"Unknown code or bad quantity:\n"+it.bad.join("\n"):"Add at least one item.");return}
if(role==="viewer")pend(t,"","add",(h.no||h.bs||h.jo||"")+": "+it.ok.map(function(i){return i.code+" × "+i.qty}).join(", "),{h:h,items:it.ok});else addTxn(t,h,it.ok,role)}
else if(d.imp){var n=0,rows=[];document.getElementById("csv").value.split(/\n/).forEach(function(l){var c=l.split(",").map(function(x){return x.trim()});if(c.length<2||!c[1]||c[0].toLowerCase()==="brand")return;if(S.products.some(function(p){return p.code===c[1]})||rows.some(function(r){return r.code===c[1]}))return;rows.push({brand:c[0].toUpperCase(),code:c[1],unit:c[2]||"pcs",opening:Number(c[3])||0,min:c[4]===undefined||c[4]===""?"":Number(c[4])})});

else if(d.ok||d.no){var id=d.ok||d.no,p=S.pending.filter(function(x){return x.id===id})[0],a={};try{a=JSON.parse(p.after)}catch(e){}
p.status=d.ok?"approved":"rejected";p.decidedBy=role;
if(d.ok){if(a.items)addTxn(p.type,a.h||{},a.items,p.by);else if(a.p){if(a.action==="add")addProd(a.p);else updProd(p.docId,a.p)}}
W("update_values",{spreadsheetId:SID,range:"pending!I"+p._row+":J"+p._row,values:[[p.status,role]]})}
else if(d.ref){mcp&&mcp.invalidate().catch(function(){}).then(load)}

else if(t.dataset.m){var o=S.products.filter(function(x){return x.code===t.dataset.m})[0];if(o)updProd(o.code,Object.assign({},o,{min:Number(t.value)||0}))}});
