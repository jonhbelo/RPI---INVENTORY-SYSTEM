.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

@media(prefers-reduced-motion:reduce){.wm{animation:none}.intro .lc{animation:none}}

.av{cursor:pointer;border:0;font:inherit;font-size:16px}
.ln{display:flex;gap:8px;margin-bottom:8px}.ln input[list]{flex:1;min-width:0}.ln input[type=number]{width:100px}
.ln input,.md input,.md select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px;font:inherit}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--bd);padding:12px 16px;border-radius:10px;z-index:99;max-width:340px}
.am.ok{color:var(--ok)}.sf{max-width:440px}.sf h3{margin:0 0 4px}
.md>div{max-height:92vh;overflow:auto}

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="lg" viewBox="0 0 300 70"><ellipse cx="34" cy="37" rx="30" ry="15" fill="#2d3a9c" transform="rotate(-13 34 37)"/><path d="M11 41Q32 26 58 31" stroke="#fff" stroke-width="3" fill="none" opacity=".75"/><text x="72" y="34" font-family="'Franklin Gothic Medium','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="29" fill="#1e2a78" textLength="224" lengthAdjust="spacingAndGlyphs">Rite Products, Incorporated</text><path d="M72 40.5H296" stroke="#1e2a78" stroke-width="1.3"/><text x="72" y="55" font-family="Arial,sans-serif" font-weight="700" font-size="9.5" fill="#1a1d2e" textLength="224" lengthAdjust="spacing">ENGINEERING SUPPLIES AND SERVICES</text></symbol></svg>

<script>
const SURL="https://docs.google.com/spreadsheets/d/1l2tvgEsEHUN8--eFF3tT-MncJ2SKct6YZdyHN8cBoLs/edit";
let API="";try{API=localStorage.getItem("rpi_api")||""}catch(e){}
const fixU=u=>u.trim().replace(/\/a\/macros\/[^\/]+\//,"/macros/");
if(!API)API="PASTE_WEB_APP_URL_HERE";API=fixU(API);
const okApi=()=>/^https:\/\/script\.google(usercontent)?\.com\//.test(API);
const NAV=[["stock","Stock","M5 3h14v18H5zM9 8h6M9 12h6M9 16h3"],["rr","Received (RR)","M12 5v14M5 12h14"],["dr","Deliveries (DR)","M12 3a9 9 0 100 18 9 9 0 000-18zM8 12l3 3 5-6"],["rs","Reservations","M5 3h14v18H5zM9 9h6M9 13h6"],["cn","Consumables","M5 4v16M12 4v16M19 4v16M3 9h4M10 14h4M17 8h4"],["imp","Import data","M12 16V4M7 9l5-5 5 5M4 20h16"],["appr","Approvals","M9 8a3 3 0 100-6 3 3 0 000 6zM3 20c0-4 3-6 6-6M16 11l2 2 4-4"],["usr","Users","M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"],["cdb","Central Database","M4 6c0-2 16-2 16 0s-16 2-16 0v12c0 2 16 2 16 0V6M4 12c0 2 16 2 16 0"],["set","Settings","M12 15a3 3 0 100-6 3 3 0 000 6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"]];
const HD={rr:["id","no","date","supplier","po","type","code","qty","by","ts"],dr:["id","no","date","client","code","qty","by","ts"],rs:["id","bs","date","client","code","qty","by","ts"],cn:["id","date","project","jo","code","qty","by","ts"]};
const FLD={rr:[["no","RR no."],["date","Date","date"],["supplier","Supplier"],["po","PO no."],["type","Type","sel"]],dr:[["no","DR no."],["date","Date","date"],["client","Client"]],rs:[["bs","Booking slip / project"],["date","Date","date"],["client","Client"]],cn:[["date","Date","date"],["project","Project / dept"],["jo","JO no."]]};
const TT={rr:"Received (RR)",dr:"Deliveries (DR)",rs:"Reservations",cn:"Consumables"};
let tok=null,user=null,S={products:[],rr:[],dr:[],rs:[],cn:[],pending:[],accounts:[]},tab="stock",q="",br="",per="",amode="login",amsg="",amok=false,rid="",vem="",ms=0,online=false,menu=false;
try{tok=localStorage.getItem("rpi_tok")}catch(e){}
const $=i=>document.getElementById(i),v=i=>{const e=$(i);return e?e.value.trim():""};
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const isA=()=>user.role==="admin";
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
async function api(a,p){const t0=Date.now();let r,x;try{x=await fetch(API,{method:"POST",body:JSON.stringify({a,t:tok,...p})})}catch(e){online=false;throw new Error("Cannot reach the backend. Open the Web App URL in your browser: it should say RPI Inventory backend OK. In Apps Script set Who has access to Anyone and use the URL ending in /exec.")}
const txt=await x.text();try{r=JSON.parse(txt)}catch(e){online=false;throw new Error(/accounts\.google|sign in/i.test(txt)?"The Web App is not public. Redeploy it with Who has access set to Anyone.":"The backend returned an error page. Paste the latest Code.gs, deploy a New version and approve the permissions.")}
online=true;ms=Date.now()-t0;if(r.error){if(r.error==="auth"){if(user){signOut();toast("Session expired. Please sign in again.")}throw new Error("Please sign in.")}throw new Error(r.error)}return r}
const objs=rows=>{const h=rows[0]||[];return rows.slice(1).map((r,i)=>{const o={_row:i+2};h.forEach((k,j)=>o[k]=r[j]??"");return o})};
const grp=rows=>{const m={},out=[];objs(rows).forEach(o=>{if(!o.id)return;let d=m[o.id];if(!d){d={items:[]};for(const k in o)if(k!=="code"&&k!=="qty")d[k]=o[k];m[o.id]=d;out.push(d)}d.items.push({code:o.code,qty:Number(o.qty)||0})});return out};
async function load(){const r=await api("data");user=r.me;S.accounts=objs(r.accounts);S.pending=objs(r.pending);for(const t of["rr","dr","rs","cn"])S[t]=grp(r[t]);
S.products=objs(r.products).map(p=>({...p,opening:Number(p.opening)||0,min:p.min===""?"":Number(p.min)}));
$("pl").innerHTML=S.products.map(p=>`<option value="${esc(p.code)}">${esc(p.brand)}</option>`).join("");render()}
const sum=(t,c)=>S[t].reduce((n,d)=>n+d.items.filter(i=>i.code===c).reduce((a,i)=>a+i.qty,0),0);
function calc(p){const i=sum("rr",p.code),o=sum("dr",p.code),rv=sum("rs",p.code),c=sum("cn",p.code),e=p.opening+i-o-rv-c,m=p.min===""?10:p.min;
return{i,o,e,m,s:e<0?["neg","Negative stock"]:e===0?["out","Out of stock"]:e<=m?["low","Low stock (≤ "+m+")"]:["in","In stock"]}}
const dash=(x,c)=>x?`<span class="${c}">${x}</span>`:'<span class="n">–</span>';
const sorted=t=>S[t].slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(Number(b.ts)||0)-(Number(a.ts)||0));
const ref=d=>d.no||d.bs||d.jo||"";
const sumTx=d=>`${ref(d)} ${d.date}: `+d.items.map(i=>i.code+" × "+i.qty).join(", ");
const txRows=(t,h,items,id,by)=>items.map(i=>HD[t].map(k=>k==="id"?id:k==="code"?i.code:k==="qty"?i.qty:k==="by"?by:k==="ts"?Date.now():h[k]||""));
const prow=(type,docId,action,summary,extra,before,reason,st="pending",dec="")=>["p_"+Date.now()+Math.random().toString(36).slice(2,5),type,docId,JSON.stringify({summary:before||""}),JSON.stringify({action,summary,...extra}),reason||"",user.username,Date.now(),st,dec];
/* ---------- auth ---------- */
const pwf=(id,l,ac)=>`<label>${l}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="eye" data-eye="${id}">Show</button></div>`;
function authV(){const m=amode;let h='<div class="auth"><div class="ac"><div class="logo" style="margin-bottom:0"><svg viewBox="0 0 300 70"><use href="#lg"/></svg></div>';
if(!okApi())return h+'<h2>Connect to Google Sheets</h2><p>Paste the Web App URL of your deployed Google Apps Script (see Code.gs).</p><label>Backend URL</label><input id="a_api" placeholder="https://script.google.com/macros/s/…/exec"><div class="am" id="am"></div><button class="add" data-api="1">Save and continue</button></div></div>';
const T={login:["Sign in","RPI Inventory System"],signup:["Create account","Use your company email address."],forgot:["Forgot password","We will email a 6-digit code to your account email."],reset:["Reset password","Enter the code we emailed you."],verify:["Verify your email","Enter the 6-digit code we sent to your email."]}[m];
h+=`<h2>${T[0]}</h2><p>${T[1]}</p>`;
if(m==="signup")h+='<label>Full name</label><input id="a_n" autocomplete="name"><label>Username</label><input id="a_u" autocomplete="username" placeholder="e.g. jbelo"><label>Email</label><input id="a_e" type="email" placeholder="name@riteproducts.com.ph" autocomplete="email">';
if(m==="login"||m==="forgot")h+=`<label>${m==="login"?"Username or email":"Username or email of your account"}</label><input id="a_i" autocomplete="username">`;
if(m==="reset"||m==="verify")h+='<label>6-digit code</label><input id="a_k" inputmode="numeric" maxlength="6">';
if(m==="login")h+=pwf("a_p","Password","current-password");
if(m==="signup"||m==="reset")h+=pwf("a_p",m==="reset"?"New password":"Password","new-password")+pwf("a_c","Confirm password","new-password");

h+=m==="login"?'<div class="sw"><button data-md="forgot">Forgot password?</button></div><div class="sw" style="margin-top:6px">New here? <button data-md="signup">Create account</button></div>':(m==="verify"?'<div class="sw"><button data-resend="1">Resend code</button></div>':"")+'<div class="sw"><button data-md="login">← Back to sign in</button></div>';
return h+'<div class="sw" style="font-size:12px"><button data-test="1">Test connection</button> · <button data-chapi="1">Change backend URL</button></div></div></div>'}
function setMsg(t,ok){amsg=t;amok=!!ok;const e=$("am");if(e){e.textContent=t;e.className="am"+(ok?" ok":"")}}
async function go(m){const pw=$("a_p")?$("a_p").value:"",btn=document.querySelector(".ac .add");if(btn)btn.disabled=true;
try{if(m==="login"){if(!v("a_i")||!pw)return setMsg("Enter your username or email and password.");await enter(await api("login",{id:v("a_i"),pw}))}

if(!n||!u||!e)return setMsg("Fill in your name, username and email.");if(!/^[a-z0-9._]{3,20}$/.test(u))return setMsg("Username: 3-20 letters, numbers, dot or underscore.");
if(!/^[^@\s]+@riteproducts\.com\.ph$/.test(e))return setMsg("Email must end with @riteproducts.com.ph");if(pw.length<8)return setMsg("Password must be at least 8 characters.");if(pw!==$("a_c").value)return setMsg("Passwords do not match.");
await api("signup",{name:n,username:u,email:e,pw});vem=e;amode="verify";setMsg("We emailed a 6-digit code to "+e+".",true);render()}

async function psave(code){const p={brand:v("p_b").toUpperCase(),code:v("p_c"),unit:v("p_u")||"pcs",opening:Number(v("p_o"))||0,min:v("p_m")===""?"":Number(v("p_m"))};

async function importCsv(){const rows=[],seen=new Set(S.products.map(p=>p.code));($("csv").value).split("\n").forEach(l=>{const c=l.split(",").map(x=>x.trim());if(c.length<2||!c[1]||c[0].toLowerCase()==="brand"||seen.has(c[1]))return;seen.add(c[1]);rows.push([c[0].toUpperCase(),c[1],c[2]||"pcs",Number(c[3])||0,c[4]===undefined||c[4]===""?"":Number(c[4])])});
